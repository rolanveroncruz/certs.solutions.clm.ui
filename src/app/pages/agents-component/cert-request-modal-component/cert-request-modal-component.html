<h2 mat-dialog-title>
    {{ data.mode === 'manageConfig' ? 'Manage Renewal Configuration' : 'Request New Certificate' }}
    <p class="subtitle" style="font-size: 14px; margin-top: 4px; font-weight: normal;">
        Target Agent: <code>{{ data.agentId }}</code>
    </p>
</h2>

<form [formGroup]="certForm" (ngSubmit)="onSubmit()">

    <mat-dialog-content>
        <mat-tab-group animationDuration="0ms" [selectedIndex]="data.mode === 'manageConfig' ? 1 : 0">

            <mat-tab label="Certificate Signing Request" [disabled]="data.mode === 'manageConfig'">
                <div class="tab-content-wrapper" style="padding-top: 16px;">
                    <div class="form-group">
                        <label for="domain_name">Common Name (Domain)</label>
                        <input id="domain_name" type="text" formControlName="domain_name" placeholder="e.g. api.internal.local">
                        @if (certForm.get('domain_name')?.invalid && certForm.get('domain_name')?.touched) {
                            <small class="error">Domain name is required.</small>
                        }
                    </div>

                    <div class="form-group">
                        <label for="organization">Organization</label>
                        <input id="organization" type="text" formControlName="organization" placeholder="Company Inc.">
                    </div>

                    <div class="form-group">
                        <label for="country">Country (ISO)</label>
                        <input id="country" type="text" formControlName="country" placeholder="US" maxlength="2">
                    </div>

                    <div class="form-group">
                        <label for="province">State / Province</label>
                        <input id="province" type="text" formControlName="province" placeholder="California">
                    </div>

                    <div class="form-group">
                        <label for="locality">City / Locality</label>
                        <input id="locality" type="text" formControlName="locality" placeholder="San Francisco">
                    </div>

                </div>
            </mat-tab>

            <mat-tab label="Renewal Configuration">
                <div class="tab-content-wrapper" style="padding-top: 16px;">
                    <app-config-selector
                        [currentConfigId]="selectedConfigId"
                        (configSelected)="onConfigSelect($event)"
                        (creatingStateChanged)="isConfigCreating = $event">
                    </app-config-selector>
                </div>
            </mat-tab>

        </mat-tab-group>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
        <button
            type="submit"
            class="btn-submit"
            [disabled]="(data.mode !== 'manageConfig' && certForm.invalid) || !selectedConfigId || isConfigCreating">
            {{ data.mode === 'manageConfig' ? 'Save Configuration' : 'Initiate Certificate Request' }}
        </button>
    </mat-dialog-actions>

</form>
