<div class="agents-container">
    <div class="view-header-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>Network Agents</h2>
    </div>

    @if (requestProgress().visible) {
        <div class="request-progress-banner">
            <div class="progress-message">
                {{ requestProgressMessages[requestProgress().messageIndex] }}
            </div>
            <div class="progress-spinner" aria-label="Processing"></div>
        </div>
    }

    @if (loading()) {
        <div class="loader">Scanning network...</div>
    } @else {
        <app-generic-data-table
            [data]="tableRows()"
            [columnDefs]="columnDefs"
            [showAddButton]="false"
            [filterSelectKeys]="['serviceName', 'Issuer']"
            [pageSize]="10"
            (actionClicked)="tableActionHandler($event)"
        >
        </app-generic-data-table>
    }
</div>
<ng-template #RenewBtn let-row let-btn="btn">
    <button type="button" class="custom-image-btn" (click)="btn.onClick(row); $event.stopPropagation();">
        <img ngSrc='/renew.png'
             width="1500"
             height="1500"

             alt="Action Icon"
             class="btn-image" />
        <span class="btn-label">Renew</span>
    </button>
</ng-template>

<ng-template #RequestBtn let-row let-btn="btn">
    <button type="button" class="custom-image-btn" (click)="btn.onClick(row); $event.stopPropagation();">
        <img ngSrc='/request.png'
             width="1500"
             height="1500"
             alt="Action Icon"
             class="btn-image" />
        <span class="btn-label">Request</span>
    </button>
</ng-template>

<ng-template #ManageBtn let-row let-btn="btn">
    <button type="button" class="custom-image-btn" (click)="btn.onClick(row); $event.stopPropagation();">
        <img ngSrc='/manage.png'
             width="1500"
             height="1500"
             alt="Action Icon"
             class="btn-image" />
        <span class="btn-label">Manage</span>
    </button>
</ng-template>
