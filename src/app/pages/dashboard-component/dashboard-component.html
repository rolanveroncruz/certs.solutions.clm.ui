<div class="dash">

    <mat-card class="hero" appearance="outlined">
        <div class="hero-row">
            <div class="hero-left">
                <div class="hero-title">
                    <mat-icon aria-hidden="true">space_dashboard</mat-icon>
                    <span>Client Dashboard</span>
                </div>

                <div class="hero-sub">
                    Monitor certificate health, upcoming expirations, and agent activity.
                </div>

                <div class="hero-actions">
                    <button mat-flat-button type="button" (click)="onRequestCertificate()">
                        <mat-icon aria-hidden="true">add</mat-icon>
                        Request Certificate
                    </button>
                </div>
            </div>
        </div>
    </mat-card>
    <section class="stats">
        <mat-card class="stat" appearance="outlined" (click)="onStatClick('/main/agents?filter=active')">
            <div class="stat-top">
                <mat-icon>verified</mat-icon>
                <div class="stat-value">{{ numActiveCertificates() }}</div>
            </div>
            <div class="stat-label">Active Certificates</div>
        </mat-card>

        <mat-card class="stat" appearance="outlined" (click)="onStatClick('/main/agents?filter=expiring')">
            <div class="stat-top">
                <mat-icon>schedule</mat-icon>
                <div class="stat-value">{{ numExpiringCertificates() }}</div>
            </div>
            <div class="stat-label">Expiring (30 days)</div>
        </mat-card>

        <mat-card class="stat" appearance="outlined" (click)="onStatClick('/main/agents?filter=online')">
            <div class="stat-top">
                <mat-icon>smart_toy</mat-icon>
                <div class="stat-value">{{ numOnlineAgents() }}</div>
            </div>
            <div class="stat-label">Agents Online</div>
        </mat-card>
    </section>
</div>
